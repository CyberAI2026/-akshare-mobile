name = "strong-stock-tail-dispatcher"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[triggers]
# Cloudflare cron uses UTC. Asia/Shanghai is UTC+8 and has no DST.
# These checks run at 14:26, 14:31, and 14:35 on weekdays.
crons = ["26 6 * * 1-5", "31 6 * * 1-5", "35 6 * * 1-5"]

[vars]
GITHUB_REPOSITORY = "CyberAI2026/-akshare-mobile"
GITHUB_REF = "main"
TAIL_WORKFLOW_FILE = "v5_tail_confirmation.yml"
