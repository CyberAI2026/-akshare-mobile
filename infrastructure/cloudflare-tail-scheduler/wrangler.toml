name = "strong-stock-tail-dispatcher"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[triggers]
# Cloudflare cron uses UTC. Asia/Shanghai is UTC+8 and has no DST.
# Tail: 14:26/14:31/14:35/14:38 weekdays. Separate expressions reduce the
# chance that one missed combined cron event removes every external check.
# The fifth expression is a routing grid for opinion mining/delivery. Worker code
# accepts only 20:30, 21:00-21:50, 22:00, and 22:12 Shanghai; other grid ticks
# are explicit no-ops. This stays within the Workers Free five-trigger limit.
crons = ["26 6 * * 1-5", "31 6 * * 1-5", "35 6 * * 1-5", "38 6 * * 1-5", "0,10,12,20,30,40,50 12-14 * * *"]

[vars]
GITHUB_REPOSITORY = "CyberAI2026/-akshare-mobile"
GITHUB_REF = "main"
TAIL_WORKFLOW_FILE = "v5_tail_confirmation.yml"
OPINION_WORKFLOW_FILE = "v5_market_opinion.yml"
OPINION_DELIVERY_WORKFLOW_FILE = "v5_market_opinion_delivery.yml"
