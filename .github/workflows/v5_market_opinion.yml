name: V5 Market Opinion Mining

on:
  workflow_dispatch:
  schedule:
    # Daily 18:47 Beijing start provides queue-delay buffer; the script waits
    # until 20:30 before collection and does not push before 21:00.
    - cron: "47 10 * * *"
  push:
    branches: [main]
    paths:
      - "research/market_opinion_mining.py"
      - "tests/test_market_opinion_mining.py"
      - ".github/workflows/v5_market_opinion.yml"

permissions:
  contents: write

concurrency:
  group: v5-market-opinion
  cancel-in-progress: false

jobs:
  opinion-mining:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      OPINION_ARTICLE_LIMIT: "20"
      OPINION_BATCH_SIZE: "4"
      OPINION_BATCH_WORKERS: "3"
      OPINION_OPENAI_TIMEOUT_SECONDS: "240"
      OPINION_COLLECT_NOT_BEFORE_CN: "20:30"
      OPINION_PUSH_NOT_BEFORE_CN: "21:00"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deterministic opinion-format tests
        run: |
          python -m py_compile research/market_opinion_mining.py
          python -m unittest tests/test_market_opinion_mining.py
      - name: Refresh branch before mining
        if: github.event_name != 'push'
        run: git pull --ff-only origin main
      - name: Mine complete public review texts
        if: github.event_name != 'push'
        run: python research/market_opinion_mining.py
      - name: Upload derived opinion database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-${{ github.run_id }}
          path: v5_data/opinion/
          if-no-files-found: warn
          retention-days: 14
