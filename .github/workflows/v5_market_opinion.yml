name: V5 Market Opinion Mining

on:
  workflow_dispatch:
  schedule:
    # Daily 20:30/20:50/21:10 Beijing, including weekends and exchange holidays.
    # The preflight below makes later attempts no-cost skips after a same-day result.
    - cron: "30,50 12 * * *"
    - cron: "10 13 * * *"
  push:
    # Manual recovery commits may include [run-opinion] to execute the bounded pipeline.
    branches: [main]
    paths:
      - "research/market_opinion_mining.py"
      - "tests/test_market_opinion_mining.py"
      - ".github/workflows/v5_market_opinion.yml"

permissions:
  contents: write

concurrency:
  group: v5-market-opinion
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Check whether today's opinion summary already exists
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          event=os.environ.get("GITHUB_EVENT_NAME","")
          force=event=="workflow_dispatch" or (event=="push" and "[run-opinion]" in os.environ.get("HEAD_MESSAGE",""))
          today=datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          path=Path("v5_data/opinion/latest.json")
          complete=False
          if path.exists():
              try:
                  complete=str(json.loads(path.read_text(encoding="utf-8")).get("source_date"))==today
              except Exception:
                  complete=False
          should_run=force or not complete
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"OPINION_PREFLIGHT source_date={today} complete={complete} force={force} should_run={should_run}")
          PY
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}

  validate:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deterministic opinion-format tests
        run: |
          python -m py_compile research/market_opinion_mining.py
          python -m unittest tests/test_market_opinion_mining.py

  opinion-batches:
    needs: [preflight, validate]
    if: needs.preflight.outputs.should_run == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opinion]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        batch: [0, 1, 2, 3, 4]
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_MODEL: gpt-5.6-terra
      OPINION_ARTICLE_LIMIT: "30"
      OPINION_MIN_ARTICLES: "15"
      OPINION_OPENAI_TIMEOUT_SECONDS: "180"
      OPINION_OPENAI_MAX_RETRIES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mine one bounded article batch
        run: |
          python research/market_opinion_mining.py \
            --stage batch \
            --batch-index ${{ matrix.batch }} \
            --batch-count 5 \
            --stage-root opinion_stage
      - name: Upload structured batch only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-batch-${{ github.run_id }}-${{ matrix.batch }}
          path: opinion_stage/batch_${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: [preflight, opinion-batches]
    if: needs.preflight.outputs.should_run == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opinion]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_TIMEOUT_SECONDS: "180"
      OPINION_OPENAI_MAX_RETRIES: "0"
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      OPINION_MIN_ARTICLES: "15"
      # 汇总完成即发送；样本不足时只发送明确的低样本提示，不用旧文凑数。
      OPINION_PUSH_AFTER_AGGREGATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: market-opinion-batch-${{ github.run_id }}-*
          path: opinion_stage
          merge-multiple: true
      - name: Aggregate structured batches
        run: python research/market_opinion_mining.py --stage aggregate --stage-root opinion_stage
      - name: Upload derived opinion database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-${{ github.run_id }}
          path: v5_data/opinion/
          if-no-files-found: warn
          retention-days: 14
