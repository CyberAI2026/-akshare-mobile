name: V5 Market Opinion Mining

on:
  workflow_dispatch:
    inputs:
      scheduler_mode:
        description: "Leave blank for manual recovery; external scheduler uses external_schedule"
        required: false
        type: string
      source_date:
        description: "Optional bounded source date for the external scheduler/manual recovery"
        required: false
        type: string
  schedule:
    # Beijing 20:30 starts collection. Re-evaluate every 10 minutes from
    # 21:00 through 21:50; 22:00 releases all quality articles only if at least 15 exist.
    - cron: "30 12 * * *"
    - cron: "0-50/10 13 * * *"
    - cron: "0 14 * * *"
  push:
    # Manual recovery commits may include [run-opinion] to execute the bounded pipeline.
    branches: [main]
    paths:
      - "research/market_opinion_mining.py"
      - "tests/test_market_opinion_mining.py"
      - ".github/workflows/v5_market_opinion.yml"
      - "v5_data/control/opinion_fallback_trigger.json"

permissions:
  contents: write

concurrency:
  group: v5-market-opinion
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      source_date: ${{ steps.gate.outputs.source_date }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Check whether today's opinion summary already exists
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          event=os.environ.get("GITHUB_EVENT_NAME","")
          message=os.environ.get("HEAD_MESSAGE","")
          scheduler_mode=os.environ.get("SCHEDULER_MODE","").strip()
          external_schedule=event=="workflow_dispatch" and scheduler_mode=="external_schedule"
          force=(event=="workflow_dispatch" and not external_schedule) or (
              event=="push" and ("[run-opinion]" in message or "[refresh-opinion-concepts]" in message)
          )
          current=datetime.now(ZoneInfo("Asia/Shanghai"))
          default_day=current.date()-timedelta(days=1) if current.hour<6 else current.date()
          source_day=default_day.isoformat()
          requested_input=os.environ.get("REQUESTED_SOURCE_DATE","").strip()
          if requested_input:
              parsed=datetime.strptime(requested_input,"%Y-%m-%d").date()
              if parsed>current.date() or (current.date()-parsed).days>3:
                  raise RuntimeError(f"source_date输入超出安全窗口: {requested_input}")
              source_day=requested_input
          if force:
              trigger=Path("v5_data/control/opinion_fallback_trigger.json")
              if trigger.exists():
                  requested=str(json.loads(trigger.read_text(encoding="utf-8")).get("source_date") or "")
                  if requested:
                      parsed=datetime.strptime(requested,"%Y-%m-%d").date()
                      if parsed>current.date() or (current.date()-parsed).days>3:
                          raise RuntimeError(f"恢复source_date超出安全窗口: {requested}")
                      source_day=requested
          today=source_day
          path=Path("v5_data/opinion/latest.json")
          complete=False
          if path.exists():
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
                  same_day=str(data.get("source_date"))==today
                  count=len(data.get("sources",[]) or [])
                  reason=str((data.get("finalization",{}) or {}).get("reason", ""))
                  complete=(
                      same_day and count>=15
                      and reason in {"deadline_minimum_met","overnight_minimum_met"}
                  )
              except Exception:
                  complete=False
          should_run=force or not complete
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
              handle.write(f"source_date={source_day}\n")
          print(f"OPINION_PREFLIGHT source_date={source_day} complete={complete} force={force} external_schedule={external_schedule} should_run={should_run}")
          PY
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          SCHEDULER_MODE: ${{ inputs.scheduler_mode }}
          REQUESTED_SOURCE_DATE: ${{ inputs.source_date }}

  validate:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deterministic opinion-format tests
        run: |
          python -m py_compile research/market_opinion_mining.py
          python -m unittest tests/test_market_opinion_mining.py

  concept-refresh:
    needs: [preflight, validate]
    if: needs.validate.result == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-opinion-concepts]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPINION_SOURCE_DATE_OVERRIDE: ${{ needs.preflight.outputs.source_date }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      OPINION_MIN_ARTICLES: "15"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh objective THS concept facts without OpenAI
        run: python research/market_opinion_mining.py --stage concept-refresh
      - name: Upload refreshed opinion database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-concept-refresh-${{ github.run_id }}
          path: v5_data/opinion/
          if-no-files-found: warn
          retention-days: 14

  discover:
    needs: [preflight, validate]
    if: needs.preflight.outputs.should_run == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opinion]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPINION_SOURCE_DATE_OVERRIDE: ${{ needs.preflight.outputs.source_date }}
      OPINION_ARTICLE_LIMIT: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover same-day articles once
        run: python research/market_opinion_mining.py --stage discover --stage-root opinion_stage
      - uses: actions/upload-artifact@v4
        with:
          name: market-opinion-discovery-${{ github.run_id }}
          path: opinion_stage/discovery.json
          if-no-files-found: error
          retention-days: 1

  opinion-batches:
    needs: [preflight, validate, discover]
    if: needs.preflight.outputs.should_run == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opinion]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TZ: Asia/Shanghai
      OPINION_SOURCE_DATE_OVERRIDE: ${{ needs.preflight.outputs.source_date }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_MODEL: gpt-5.6-terra
      OPINION_ARTICLE_LIMIT: "80"
      OPINION_MIN_ARTICLES: "15"
      OPINION_OPENAI_TIMEOUT_SECONDS: "180"
      OPINION_OPENAI_MAX_RETRIES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-opinion-discovery-${{ github.run_id }}
          path: opinion_stage
      - name: Mine one bounded article batch
        run: |
          python research/market_opinion_mining.py \
            --stage batch \
            --batch-index ${{ matrix.batch }} \
            --batch-count 8 \
            --stage-root opinion_stage
      - name: Upload structured batch only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-batch-${{ github.run_id }}-${{ matrix.batch }}
          path: opinion_stage/batch_${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: [preflight, discover, opinion-batches]
    if: always() && needs.preflight.outputs.should_run == 'true' && needs.discover.result == 'success' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opinion]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPINION_SOURCE_DATE_OVERRIDE: ${{ needs.preflight.outputs.source_date }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_MODEL: gpt-5.6-terra
      OPINION_OPENAI_TIMEOUT_SECONDS: "180"
      OPINION_OPENAI_MAX_RETRIES: "0"
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      OPINION_MIN_ARTICLES: "15"
      # 22:00后且合格样本不少于15篇才汇总发送；全部合格文章一并纳入。
      OPINION_PUSH_AFTER_AGGREGATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: market-opinion-batch-${{ github.run_id }}-*
          path: opinion_stage
          merge-multiple: true
      - name: Aggregate structured batches
        run: python research/market_opinion_mining.py --stage aggregate --stage-root opinion_stage
      - name: Upload derived opinion database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-opinion-${{ github.run_id }}
          path: v5_data/opinion/
          if-no-files-found: warn
          retention-days: 14

  failure-alert:
    needs: [preflight, discover, opinion-batches, aggregate]
    if: always() && needs.preflight.outputs.should_run == 'true' && (needs.discover.result == 'failure' || needs.aggregate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Notify opinion pipeline failure
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          token=(os.getenv("PUSHPLUS_TOKEN") or "").strip()
          if not token: raise SystemExit(0)
          payload={"token":token,"title":"A股二次启动｜市场观点任务故障",
                   "content":"当日淘股吧复盘采集或聚合失败，未生成正式报告。系统没有发送旧报告，请检查GitHub Actions。",
                   "template":"html","channel":"wechat"}
          req=urllib.request.Request("https://www.pushplus.plus/send",data=json.dumps(payload,ensure_ascii=False).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as resp:
              result=json.loads(resp.read().decode())
          if int(result.get("code",-1))!=200: raise SystemExit(str(result))
          PY
