name: V5 After-Close Reusable Stage

# Suspended 2026-10-15 by explicit user request: no OpenAI API token usage.
# All jobs are disabled; preserve implementation for audit/history.
# Disabled 2026-10-17 by explicit user request; preserve workflow history and data.
# No scheduled, push, or manual execution trigger remains.
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-stage:
    if: ${{ false }} # suspended by user request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m research.after_close_stages ${{ inputs.stage }}
