name: V5 After-Close Research

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: 'Path to daily strong-stock batch CSV; leave empty to maintain existing master pool only'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'v5_data/inbox/daily_*.csv'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Validate staged runner
        run: |
          python -m py_compile v5_cli.py research/after_close_stages.py
          python -m unittest tests/test_v5_data_layers.py tests/test_after_close_stages.py

  initialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Initialize immutable run state
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BATCH=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^v5_data/inbox/daily_.*\.csv$' | tail -1)
          else
            BATCH='${{ inputs.batch_path }}'
          fi
          if [ -n "$BATCH" ]; then
            python research/after_close_stages.py init --batch "$BATCH"
          else
            python research/after_close_stages.py init
          fi

  screen-25d:
    needs: initialize
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 25d

  screen-120d:
    needs: screen-25d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 120d

  lifecycle-250d:
    needs: screen-120d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 250d

  market-context:
    needs: lifecycle-250d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: market

  ai-finalize:
    needs: market-context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python research/after_close_stages.py ai
      - name: Upload V5 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-after-close-${{ github.run_number }}
          path: v5_data/
          if-no-files-found: warn
          retention-days: 14
