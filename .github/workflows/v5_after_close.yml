name: V5 After-Close Research

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: 'Path to daily strong-stock batch CSV; leave empty to maintain existing master pool only'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'v5_data/inbox/daily_*.csv'
      - 'research/after_close_stages.py'
      - 'tests/test_after_close_stages.py'
      - '.github/workflows/v5_after_close.yml'
      - '.github/workflows/v5_after_close_stage.yml'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_pipeline: ${{ steps.scope.outputs.run_pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Validate staged runner
        run: |
          python -m py_compile v5_cli.py research/after_close_stages.py
          python -m unittest tests/test_v5_data_layers.py tests/test_after_close_stages.py
      - name: Decide whether this event contains a daily batch
        id: scope
        shell: bash
        run: |
          RUN_PIPELINE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_PIPELINE=true
          elif git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -q '^v5_data/inbox/daily_.*\.csv$'; then
            RUN_PIPELINE=true
          fi
          echo "run_pipeline=$RUN_PIPELINE" >> "$GITHUB_OUTPUT"
          echo "RUN_PIPELINE=$RUN_PIPELINE"

  initialize:
    needs: validate
    if: needs.validate.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Initialize immutable run state
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BATCH=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^v5_data/inbox/daily_.*\.csv$' | tail -1)
          else
            BATCH='${{ inputs.batch_path }}'
          fi
          if [ -n "$BATCH" ]; then
            python research/after_close_stages.py init --batch "$BATCH"
          else
            python research/after_close_stages.py init
          fi

  screen-25d:
    needs: initialize
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 25d

  screen-120d:
    needs: screen-25d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 120d

  lifecycle-250d:
    needs: screen-120d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: 250d

  market-context:
    needs: lifecycle-250d
    uses: ./.github/workflows/v5_after_close_stage.yml
    with:
      stage: market

  ai-finalize:
    needs: market-context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python research/after_close_stages.py ai
      - name: Upload V5 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-after-close-${{ github.run_number }}
          path: v5_data/
          if-no-files-found: warn
          retention-days: 14

  failure-alert:
    needs: [validate, initialize, screen-25d, screen-120d, lifecycle-250d, market-context, ai-finalize]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Send one after-close failure alert
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = (os.getenv("PUSHPLUS_TOKEN") or "").strip()
          if not token:
              print("PUSHPLUS_TOKEN missing; failure alert cannot be sent")
              raise SystemExit(0)
          now = datetime.now(ZoneInfo("Asia/Shanghai")).isoformat(timespec="seconds")
          payload = {
              "token": token,
              "title": "A股二次启动系统｜盘后任务故障",
              "content": (
                  f"盘后分段任务在 {now} 运行失败。<br>"
                  "失败不能解释为0只观察股，请检查具体阶段日志。<br>"
                  "运行地址：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              ),
              "template": "html",
              "channel": "wechat",
          }
          req = urllib.request.Request(
              "https://www.pushplus.plus/send",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              result = json.loads(resp.read().decode("utf-8", errors="replace"))
              if int(result.get("code", -1)) != 200:
                  raise SystemExit(f"PushPlus failure alert rejected: {result}")
          PY
