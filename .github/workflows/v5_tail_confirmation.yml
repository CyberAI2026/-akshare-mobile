name: V5 Tail Confirmation

on:
  workflow_dispatch:
  schedule:
    # 06:40 UTC = 14:40 Beijing time
    - cron: '40 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  tail-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: ${{ github.ref_name }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V5 tail confirmation
        run: python v5_cli.py tail

      - name: Upload V5 tail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-tail-${{ github.run_number }}
          path: v5_data/
          if-no-files-found: warn
          retention-days: 14
