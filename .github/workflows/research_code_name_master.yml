name: Research A-Share Code-Name Master

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1-5"
  push:
    branches: [main]
    paths:
      - "research/code_name_master_only.py"
      - ".github/workflows/research_code_name_master.yml"

permissions:
  contents: write

jobs:
  fetch-master:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/code_name_master_only.py
      - name: Persist latest code-name reference
        run: |
          mkdir -p v5_data/reference
          cp research_code_name_master/a_share_code_name.csv v5_data/reference/a_share_code_name_master.csv
          git config user.name "V5 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add v5_data/reference/a_share_code_name_master.csv
          git diff --cached --quiet || git commit -m "Refresh A-share code-name reference"
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-code-name-master-${{ github.run_id }}
          path: research_code_name_master/
          retention-days: 7
