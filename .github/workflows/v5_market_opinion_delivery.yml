name: V5 Market Opinion Delivery

on:
  workflow_dispatch:
  schedule:
    # Beijing 21:00/21:20/21:40. Later attempts safely skip after a saved receipt.
    - cron: "0,20,40 13 * * *"

permissions:
  contents: write

concurrency:
  group: v5-market-opinion-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deliver latest same-day summary once
        run: python research/market_opinion_mining.py --stage push
