name: V5 Market Opinion Delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v5_data/opinion/delivery_requests/**"
  schedule:
    # Redundant delivery checks after the mining runs; 22:10 is the final deadline check.
    - cron: "5,25,45 13 * * *"
    - cron: "10 14 * * *"

permissions:
  contents: write

concurrency:
  group: v5-market-opinion-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deliver latest same-day summary once
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          latest_path = Path("v5_data/opinion/latest.json")
          staging_path = Path("v5_data/opinion/staging") / f"{today}.json"

          latest = {}
          if latest_path.exists():
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
          latest_count = len(latest.get("sources", []) or [])
          same_day_ready = str(latest.get("source_date") or "") == today and latest_count >= 15
          if same_day_ready:
              subprocess.run(
                  ["python", "research/market_opinion_mining.py", "--stage", "push"],
                  check=True,
              )
              raise SystemExit(0)

          if staging_path.exists():
              staging = json.loads(staging_path.read_text(encoding="utf-8"))
              staging_count = len(staging.get("sources", []) or [])
              if str(staging.get("source_date") or "") == today and staging_count < 15:
                  print(
                      f"OPINION_DELIVERY_SKIPPED source_date={today} "
                      f"quality_articles={staging_count} minimum=15 reason=minimum_not_met"
                  )
                  raise SystemExit(0)

          raise RuntimeError(
              f"当天正式观点报告缺失且没有可核验的低样本staging: "
              f"source_date={today} latest_source={latest.get('source_date')} "
              f"latest_articles={latest_count}"
          )
          PY

  failure-alert:
    needs: deliver
    if: failure() && (github.event_name != 'schedule' || github.event.schedule == '10 14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Notify missing same-day opinion report
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          token=(os.getenv("PUSHPLUS_TOKEN") or "").strip()
          if not token: raise SystemExit(0)
          payload={"token":token,"title":"A股二次启动｜22点观点报告未生成",
                   "content":"22:10最终兜底仍未找到当日淘股吧复盘报告；系统没有发送旧报告，请检查采集任务。",
                   "template":"html","channel":"wechat"}
          req=urllib.request.Request("https://www.pushplus.plus/send",data=json.dumps(payload,ensure_ascii=False).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as resp: result=json.loads(resp.read().decode())
          if int(result.get("code",-1))!=200: raise SystemExit(str(result))
          PY
