name: V5 After-Close AI Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5_after_close_ai_recovery.yml'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  recover-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Resume only the failed OpenAI stage
        shell: bash
        run: |
          RECOVERY_STATE=$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('v5_data/staging/after_close_current.json').read_text(encoding='utf-8'))
          print(f"{state.get('stage')}:{state.get('status')}")
          PY
          )
          if [ "$RECOVERY_STATE" = "ai_failed:completed_ai_failed" ] || [ "$RECOVERY_STATE" = "completed:completed_push_failed" ]; then
            python -m research.after_close_stages ai
          elif [ "$RECOVERY_STATE" = "completed:completed" ]; then
            echo "AI recovery already completed; skip idempotently."
          else
            echo "Unexpected recovery state: $RECOVERY_STATE"
            exit 1
          fi
      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-after-close-AI-recovery-${{ github.run_number }}
          path: v5_data/
          if-no-files-found: warn
          retention-days: 14
