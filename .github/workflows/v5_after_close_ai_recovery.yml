name: V5 After-Close AI Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5_after_close_ai_recovery.yml'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  recover-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Resume only the failed OpenAI stage
        run: python -m research.after_close_stages ai
      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-after-close-AI-recovery-${{ github.run_number }}
          path: v5_data/
          if-no-files-found: warn
          retention-days: 14
