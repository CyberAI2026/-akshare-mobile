name: V5 Official Market Count Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "v5_core.py"
      - "tests/test_v5_data_layers.py"
      - ".github/workflows/v5_official_market_count_test.yml"

permissions:
  contents: read

jobs:
  market-count-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run deterministic data-layer tests
        run: |
          python -m py_compile v5_core.py v5_cli.py app.py
          python -m unittest tests/test_v5_data_layers.py
      - name: Test public market counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import v5_core as core
          out=Path("market_count_test"); out.mkdir(exist_ok=True)
          idx, breadth, qa = core.fetch_market_review(180)
          breadth.to_csv(out/"market_breadth.csv", index=False, encoding="utf-8-sig")
          qa.to_csv(out/"market_qa.csv", index=False, encoding="utf-8-sig")
          idx.to_csv(out/"market_indices_180d.csv", index=False, encoding="utf-8-sig")
          print(breadth.to_string(index=False))
          print(qa.to_string(index=False))
          if breadth.empty:
              raise SystemExit("FAIL: market breadth empty")
          r=breadth.iloc[0]
          for c in ["上涨家数","下跌家数","涨停家数","跌停家数"]:
              if c not in breadth.columns or str(r[c]) in ("nan","None",""):
                  raise SystemExit(f"FAIL: public field missing: {c}")
          if bool(r.get("市场宽度是否降级", True)):
              raise SystemExit("FAIL: 市场宽度正式逐股快照不可用，已发生降级")
          if bool(r.get("涨跌停是否降级", True)):
              raise SystemExit("FAIL: 东方财富公开涨跌停池不可用，已发生降级")
          if int(r["股票数"]) < 5000:
              raise SystemExit(f"FAIL: 正式逐股快照覆盖不足，股票数={int(r['股票数'])}<5000")
          if str(r.get("业务时区","")) != "Asia/Shanghai" or not str(r.get("数据时间","")).endswith("+0800"):
              raise SystemExit("FAIL: 市场快照未使用带偏移的北京时间")
          if int(r["上涨家数"])+int(r["下跌家数"])+int(r["平盘家数"]) != int(r["股票数"]):
              raise SystemExit("FAIL: 上涨+下跌+平盘与正式股票数不一致")
          up_codes=[x for x in str(r.get("涨停股池代码","")).split("|") if x]
          down_codes=[x for x in str(r.get("跌停股池代码","")).split("|") if x]
          if len(up_codes)!=int(r["涨停家数"]) or len(down_codes)!=int(r["跌停家数"]):
              raise SystemExit("FAIL: 涨跌停成分代码数量与正式计数不一致")
          print("OFFICIAL_MARKET_COUNT_TEST_OK")
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-official-market-count-test
          path: market_count_test/
          retention-days: 7
