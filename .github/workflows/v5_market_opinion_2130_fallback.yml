name: V5 Market Opinion 21:30 Fallback

on:
  workflow_dispatch:
  schedule:
    # Independent fallback for Beijing 21:30. Two-minute offset lets the primary
    # scheduler enqueue first while still meeting the 21:30 retry checkpoint.
    - cron: "32 13 * * 1-5"

permissions:
  actions: read
  contents: write

concurrency:
  group: v5-market-opinion-2130-fallback
  cancel-in-progress: false

jobs:
  ensure-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: gate
        name: Check summary and nearby primary runs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now_utc = datetime.now(timezone.utc)
          now_cn = datetime.now(ZoneInfo("Asia/Shanghai"))
          business_day = now_cn.date()-timedelta(days=1) if now_cn.hour<6 else now_cn.date()
          today = business_day.isoformat()
          latest = Path("v5_data/opinion/latest.json")
          complete = False
          article_count = 0
          reason = ""
          if latest.exists():
              try:
                  data = json.loads(latest.read_text(encoding="utf-8"))
                  if str(data.get("source_date")) == today:
                      article_count = len(data.get("sources", []) or [])
                      reason = str((data.get("finalization", {}) or {}).get("reason", ""))
                      complete = (
                          article_count >= 15
                          and reason in {"deadline_minimum_met", "overnight_minimum_met"}
                      )
              except Exception as exc:
                  print(f"FALLBACK_LATEST_PARSE_WARNING {exc}")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/v5_market_opinion.yml/runs?per_page=20",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              runs = json.loads(resp.read().decode("utf-8")).get("workflow_runs", [])

          cutoff = now_utc - timedelta(minutes=10)
          nearby = []
          for run in runs:
              created = datetime.fromisoformat(str(run.get("created_at", "")).replace("Z", "+00:00"))
              if created < cutoff:
                  continue
              status = str(run.get("status", ""))
              conclusion = str(run.get("conclusion") or "")
              if status in {"queued", "in_progress", "waiting", "pending"} or conclusion == "success":
                  nearby.append({"id": run.get("id"), "status": status, "conclusion": conclusion})

          should_run = not complete and not nearby
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
              handle.write(f"source_date={today}\n")
          print(
              f"OPINION_2130_FALLBACK source_date={today} articles={article_count} "
              f"reason={reason or 'none'} complete={complete} nearby_runs={nearby} should_run={should_run}"
          )
          PY

      - name: Create bounded recovery trigger
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          business_day = now.date()-timedelta(days=1) if now.hour<6 else now.date()
          path = Path("v5_data/control/opinion_fallback_trigger.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "beijing_time": now.isoformat(timespec="seconds"),
              "source_date": business_day.isoformat(),
              "watchdog_stage": "retry_2130_fallback",
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5_data/control/opinion_fallback_trigger.json
          git commit -m "[run-opinion] fallback retry_2130 ${{ steps.gate.outputs.source_date }}"
          git push origin HEAD:main
