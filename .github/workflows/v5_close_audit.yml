name: V5 Tail-to-Close Breadth Audit

on:
  schedule:
    # Staggered 15:07/15:17/15:27 retries; completed runs skip idempotently.
    - cron: '7,17,27 7 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5_close_audit.yml'
      - 'v5_data/control/close_audit_fallback_trigger.json'

permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  close-audit:
    # Ordinary pushes remain validation-only; an explicit recovery marker may run the idempotent audit.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[close-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reconcile 14:45 snapshot with official close-time snapshot
        run: python v5_cli.py close_audit
      - name: Backfill recommendation close anchors
        run: python research/recommendation_feedback.py update --no-notify
      - name: Persist recommendation close anchors
        shell: bash
        run: |
          git config user.name "V5 Close Audit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add --all -- v5_data/feedback
          if git diff --cached --quiet; then
            echo "No recommendation close-anchor changes to commit"
          else
            git commit -m "Backfill recommendation close anchors $(date +%F-%H%M)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-close-audit-${{ github.run_id }}
          path: v5_data/market/close_audit/
          retention-days: 30

  failure-alert:
    needs: close-audit
    if: failure() && (github.event_name != 'schedule' || github.event.schedule == '27 7 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Notify final close-audit failure
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          token=(os.getenv("PUSHPLUS_TOKEN") or "").strip()
          if not token: raise SystemExit(0)
          payload={"token":token,"title":"A股二次启动｜收盘复核故障",
                   "content":"15:27最终兜底仍未完成收盘复核；可能缺少当日尾盘快照，请检查尾盘工作流。",
                   "template":"html","channel":"wechat"}
          req=urllib.request.Request("https://www.pushplus.plus/send",data=json.dumps(payload,ensure_ascii=False).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as resp: result=json.loads(resp.read().decode())
          if int(result.get("code",-1))!=200: raise SystemExit(str(result))
          PY
