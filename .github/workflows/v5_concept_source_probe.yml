name: V5 Concept Source Probe

on:
  push:
    branches: [main]
    paths:
      - 'research/concept_source_probe.py'
      - '.github/workflows/v5_concept_source_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research/concept_source_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-concept-source-probe-${{ github.run_id }}
          path: concept_source_probe/
          if-no-files-found: warn
          retention-days: 3
