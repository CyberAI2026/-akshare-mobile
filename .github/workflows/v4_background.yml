name: V4 Background Automation (Legacy - Manual Only)

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Legacy V4 manual job only'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - 1445
      pool_path:
        description: 'Legacy V4 pool path'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  legacy-manual-only:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "V4 legacy workflow is manual-only. V5 owns all new automation."
          echo "No scheduled V4 task will run."
