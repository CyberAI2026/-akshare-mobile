name: V5 Effective Breakout Revision

# Suspended 2026-10-15 by explicit user request: no OpenAI API token usage.
# All jobs are disabled; preserve implementation for audit/history.
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: v5-data-write
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ false }} # suspended by user request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_tail_stages tests.test_second_start_evidence tests.test_after_close_ai_contract tests.test_after_close_stages
      - run: python -m research.effective_breakout_revision prepare --source-run "${{ inputs.source_run || 'v5_data/runs/20260921_223444' }}"

  ai:
    if: ${{ false }} # suspended by user request
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m research.effective_breakout_revision ai

  deliver:
    if: ${{ false }} # suspended by user request
    needs: ai
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TRADING_DATA_KEY: ${{ secrets.TRADING_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m research.effective_breakout_revision deliver
